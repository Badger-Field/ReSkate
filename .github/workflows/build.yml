# Builds every push to main and every pull request: the launcher, runtime and server on Windows
# (MSVC, as releases are built), and the dedicated server with the regression tests on Linux.
# Each job runs a script in ci/, so the same checks run on your own PC with no Actions minutes:
# ci/local.sh (Linux, LiDAR parks) and ci/local.ps1 (Windows). Changes to docs alone build nothing.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # crash reports name the build by git describe
      - name: Configure, build and test
        shell: pwsh
        run: ./ci/local.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: reskate-windows-${{ github.sha }}
          path: |
            build/vs2022-x64/Release/ReSkateLauncher.exe
            build/vs2022-x64/Release/ReSkate.dll
            build/vs2022-x64/Release/ReSkateServer.exe
          retention-days: 14

  linux:
    name: Linux (server and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure, build and test
        run: ci/local.sh linux

  lidar-parks:
    name: LiDAR parks (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f contrib/lidar-parks/requirements.txt && echo "yes=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.present.outputs.yes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.yes
        run: ci/local.sh lidar
